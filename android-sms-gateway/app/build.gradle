apply plugin: 'com.android.application'
android {
 namespace 'ro.bookeasy.smsgateway'
 compileSdk 36
 defaultConfig { applicationId 'ro.bookeasy.gateway'; minSdk 26; targetSdk 36; versionCode 2; versionName '1.1' }
 def signingFile = rootProject.file('../../mobile-client/.private/signing.properties')
 if(signingFile.exists()) {
  def values = new Properties(); signingFile.withInputStream { values.load(it) }
  signingConfigs { release { storeFile rootProject.file('../../mobile-client/.private/bookeasy-release.jks'); storePassword values.getProperty('password'); keyAlias 'bookeasy'; keyPassword values.getProperty('password') } }
 }
 buildTypes { release { if(signingFile.exists()) signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
